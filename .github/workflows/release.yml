name: release

# Packs the plugin and attaches the zip to the release for its version, so
# https://github.com/distilledcx/plugins/releases/latest/download/distilled-plugin.zip is always the newest build.
on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "scripts/pack.ts"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun scripts/pack.ts distilled
      - name: attach the zip to this version's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(jq -r .version plugins/distilled/.claude-plugin/plugin.json)"
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" dist/distilled-plugin.zip --clobber
          else
            gh release create "$version" dist/distilled-plugin.zip --title "Distilled plugin $version" \
              --notes "Upload distilled-plugin.zip in Claude under Customize > Plugins > Add > Upload plugin, or add this repository as a marketplace."
          fi
